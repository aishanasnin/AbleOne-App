name: ableone_app
description: "AbleOne - AI Powered Accessibility & Inclusive Learning Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ----------------------------
  # State Management
  # ----------------------------
  flutter_riverpod: ^2.6.1

  # ----------------------------
  # Navigation
  # ----------------------------
  go_router: ^14.8.1

  # ----------------------------
  # Firebase
  # ----------------------------
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10

  # ----------------------------
  # Google Authentication
  # ----------------------------
  google_sign_in: ^6.3.0

  # ----------------------------
  # Local Storage
  # ----------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

  # ----------------------------
  # Secure Storage
  # ----------------------------
  flutter_secure_storage: ^9.2.4

  # ----------------------------
  # Utilities
  # ----------------------------
  intl: ^0.20.2
  logger: ^2.7.0
  uuid: ^4.6.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700